name: Upload to LuaRocks

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'tag/branch/commit to be uploaded to luarocks'
        required: true
        default: 'main'
        type: string
  push:
    tags:
      - "v*"

jobs:
  luarocks-upload:
    runs-on: ubuntu-24.04
    name: Upload Package to LuaRocks
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-tags: true
          persist-credentials: false
      - name: Upload package to luarocks
        uses: lumen-oss/luarocks-tag-release@adbca66e871a519055f4917c6af5fbf19f656f5d # v7.2.0
        env:
          LUAROCKS_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}
        with:
          version: ${{ inputs.ref || github.ref_name }}
          labels: |
            neovim
            fennel
          dependencies: |
            fennel
          test_dependencies: |
            vusted
