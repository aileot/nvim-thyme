name: Test
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        nvim_version:
          - v0.10.2
          - stable
          - nightly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # TODO: Revert to gh-actions-lua when it's fixed to be up-to-date, and
      # remove unnecessary `sudo` in installing test dependencies.
      - name: Install luarocks
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 luarocks
      # - uses: leafo/gh-actions-lua@v11
      #   with:
      #     luaVersion: "luajit-openresty"
      # - uses: leafo/gh-actions-luarocks@v5
      - name: Install test dependencies in Luarocks
        run: |
          sudo luarocks --lua-version=5.1 install fennel
          sudo luarocks --lua-version=5.1 install vusted
      - name: Install cargo for parinfer-rust dependent test
        uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3 # v1.3.0
      - uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1.6.1
        id: vim
        with:
          neovim: true
          version: ${{ matrix.nvim_version }}
      - name: Run tests
        env:
          VUSTED_EXTRA_FLAGS: "--defer-print --suppress-pending"
          VUSTED_EXTRA_ARGS: "-Es"
        run: |
          make -j build
          make test
